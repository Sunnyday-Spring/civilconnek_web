name: Civil Connek CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-build:
    name: Code Verification & Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Code Quality Inspection
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build Test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_dummy_anon_key' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '1234' }}
        run: npm run build
